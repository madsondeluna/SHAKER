[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shaker"
version = "0.1.0"
description = "Stochastic Homogeneous-mixture Assembly Kit for Ensemble Replicas"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "vermouth>=0.10",
    "PeptideBuilder>=1.1",
    "biopython>=1.83",
    "rich>=13.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
brand = ["vtracer>=0.6", "pillow>=10", "scipy>=1.11", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/shaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
shaker = "shaker.cli:main"
