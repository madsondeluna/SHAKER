<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAKER</title>
<link rel="icon" href="mark-light.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <header class="bar">
    <a class="brand" href="#/" aria-label="SHAKER overview">
      <img class="logo-light" src="mark-light.svg" alt="">
      <img class="logo-dark" src="mark-dark.svg" alt="">
      <span translate="no">SHAKER</span>
    </a>
    <nav aria-label="Sections">
      <a href="#/" data-nav="overview">Overview</a>
      <a href="#/progress" data-nav="progress">Progress</a>
      <a href="#/peptides" data-nav="peptides">Peptides</a>
      <a href="#/events" data-nav="events">Events</a>
    </nav>
    <button class="button" id="mode" type="button" aria-pressed="false">Dark</button>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">
    <span class="status" id="live" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><span>Connecting</span></span>
    <span id="version"></span>
  </footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
